name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The crate lives in a subdirectory rather than at the repo root.
  CRATE_DIR: files/multiaxis_slicer

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eframe/glow, three-d and rfd link against system GL/X11/GTK libraries.
      # tritet compiles TetGen from C++ source, so a toolchain is required too.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libgl1-mesa-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}

      # --all-targets covers examples, which have drifted from the library API
      # before and broke silently because nothing compiled them.
      - name: Build
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo build --all-targets --locked

      - name: Test
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # TODO(T-01): make this job blocking once the backlog is cleared.
    #   cargo fmt --check -> ~15k diff lines across ~1000 sites
    #   cargo clippy      -> 157 warnings (0 errors)
    # Reformatting/linting the whole tree in one commit would bury real changes
    # in noise, so this reports without gating merges. Do not delete this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libgl1-mesa-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}

      - name: Format check
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo clippy --all-targets -- -D warnings
